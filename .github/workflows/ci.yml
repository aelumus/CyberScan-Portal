name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Secrets: fail pipeline if credentials leaked into git
  gitleaks:
    name: "Secrets · Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # вся история, не только последний коммит

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SCA: filesystem (soft-fail — смотрим отчёт, не валим пайплайн)
  trivy-fs:
    name: "SCA · Trivy FS"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          format: table
          exit-code: "1"
          timeout: 10m
          skip-dirs: Malware-Detection-and-Analysis-using-Machine-Learning-main,zap-reports
  

  # Frontend:ESLint + TypeScript
  lint-frontend:
    name: "Frontend · Lint & Types"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Audit dependencies (SCA)
        run: npm audit --audit-level=critical


  # Backend:Ruff linter + formatter 
  lint-backend:
    name: "Backend · Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format --check backend/

      - name: Install Security Tools
        run: pip install bandit pip-audit

      - name: Run Bandit (SAST)
        run: bandit -r backend/ -x backend/gen_test_malware.py -ll


      - name: Run pip-audit (SCA)
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325


  # Docker: build both images
  build:
    name: "Docker · Build Images"
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, gitleaks]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for build
        run: cp .env.example .env

      - name: Build app services
        run: docker compose build caddy backend frontend worker

      - name: Trivy scan app images
        continue-on-error: true
        run: |
          for img in $(docker compose config --images caddy backend frontend worker | sort -u); do
            echo "=== Trivy image: $img ==="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 0 \
              "$img"
          done
              
  # DAST: OWASP ZAP Baseline against running stack
  dast:
    name: "DAST · ZAP Baseline"
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: cp .env.example .env

      - name: Create reports dir
        run: |
          mkdir -p zap-reports
          # ZAP container user must be able to write reports on the runner mount
          chmod -R 777 zap-reports

      - name: Start app (caddy + backend + frontend + worker)
        run: docker compose up -d --build caddy backend frontend worker

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/health; then
              echo "healthy"
              exit 0
            fi
            echo "waiting... $i"
            sleep 5
          done
          echo "health check failed"
          docker compose ps
          docker compose logs --tail=80 backend caddy
          exit 1

      - name: Run ZAP Baseline
        continue-on-error: true
        run: docker compose --profile dast run --rm --user root zap

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-reports/
          if-no-files-found: warn
