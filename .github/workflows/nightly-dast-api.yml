# Nightly: ZAP API scan (OpenAPI) + JWT auth
name: Nightly DAST API

on:
  # 02:00 UTC ≈ 07:00 Asia/Almaty (UTC+5)
  schedule:
    - cron: "0 2 * * *"
  # Actions → Nightly DAST API → Run workflow
  workflow_dispatch:

jobs:
  zap-api:
    name: "DAST · ZAP API scan (auth)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create .env
        run: cp .env.example .env

      - name: Create reports dir
        run: |
          mkdir -p zap-reports
          chmod -R 777 zap-reports

      - name: Start app
        run: docker compose up -d --build caddy backend frontend worker

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/health; then
              echo "healthy"
              exit 0
            fi
            echo "waiting... $i"
            sleep 5
          done
          echo "health check failed"
          docker compose ps
          docker compose logs --tail=80 backend caddy
          exit 1

      # /openapi.json is NOT on Caddy — only on backend inside the network
      - name: Export OpenAPI spec
        run: |
          docker exec cyberscan-backend curl -fsS http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json
          docker cp cyberscan-backend:/tmp/openapi.json ./zap-reports/openapi.json
          test -s ./zap-reports/openapi.json
          head -c 80 ./zap-reports/openapi.json

      # Credentials live in GitHub Secrets — never in the repo
      - name: Obtain JWT for ZAP
        id: auth
        env:
          ZAP_TEST_EMAIL: ${{ secrets.ZAP_TEST_EMAIL }}
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
          ZAP_TEST_USERNAME: ${{ secrets.ZAP_TEST_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${ZAP_TEST_EMAIL}" ] || [ -z "${ZAP_TEST_PASSWORD}" ] || [ -z "${ZAP_TEST_USERNAME}" ]; then
            echo "Missing secrets: set ZAP_TEST_EMAIL, ZAP_TEST_PASSWORD, ZAP_TEST_USERNAME in repo Settings → Secrets"
            exit 1
          fi
          # Fresh DB each CI run → register first; if user already exists, login still works
          curl -sS -X POST http://localhost/api/auth/register \
            -d "username=${ZAP_TEST_USERNAME}&email=${ZAP_TEST_EMAIL}&password=${ZAP_TEST_PASSWORD}" \
            -o /tmp/register.json -w "%{http_code}" | tee /tmp/register.code
          echo
          TOKEN=$(curl -sS -X POST http://localhost/api/auth/login \
            -d "email=${ZAP_TEST_EMAIL}&password=${ZAP_TEST_PASSWORD}" | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Login failed"; cat /tmp/register.json || true; exit 1
          fi
          echo "::add-mask::$TOKEN"
          # Prove auth works before spending time on ZAP
          curl -sS -o /tmp/me.json -w "%{http_code}" \
            http://localhost/api/auth/me -H "Authorization: Bearer ${TOKEN}" | tee /tmp/me.code
          echo
          test "$(cat /tmp/me.code)" = "200"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Run ZAP API scan (with Bearer)
        continue-on-error: true
        env:
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
        run: |
          docker compose --profile dast run --rm --user root \
            -e ZAP_AUTH_HEADER_VALUE \
            --entrypoint zap-api-scan.py zap \
            -t /zap/wrk/openapi.json \
            -f openapi \
            -O http://caddy \
            -r zap-api-report.html \
            -J zap-api-report.json \
            -I

      - name: Upload API scan reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-api-report
          path: |
            zap-reports/zap-api-report.html
            zap-reports/zap-api-report.json
            zap-reports/openapi.json
          if-no-files-found: warn
